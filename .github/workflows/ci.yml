name: HAL build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r29
        run: sdkmanager --install "ndk;29.0.14206865"

      - name: Build Android ARM64 release
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/29.0.14206865"
          ./build.sh release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oplus-charger-hal-lime
          path: odm/
          if-no-files-found: error
